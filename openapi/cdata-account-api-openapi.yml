openapi: 3.2.0
info:
  title: CData Connect AI REST API Embedded Account API
  version: v1
servers:
- url: https://cloud.cdata.com/api
  description: Production base URL
security:
- BearerAuth: []
tags:
- name: Account
paths:
  /poweredby/account/list:
    get:
      summary: List Accounts
      tags:
      - Account
      operationId: listAccounts
      description: List Accounts lists the sub-accounts within the parent account.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountListResult'
              example:
                accounts:
                - id: fee1ce9d-c40c-4ef6-8f8c-77461315713d
                  externalId: ExternalId
                  accountName: Acme Corporation
                  created: '2023-07-13T20:42:56.317Z'
                - id: c6cc4c16-35c8-4657-90c6-f93d401b0ae9
                  externalId: GlobeInc
                  accountName: Globe Inc
                  created: '2024-07-16T18:03:19.622Z'
  /poweredby/account/{accountIdOrExternalId}:
    get:
      summary: Get Sub-Account
      tags:
      - Account
      operationId: getAccount
      description: Get Sub-Account returns a single sub-account within the parent account. You can look up the sub-account by either its internal Connect AI account Id or its external Id.
      parameters:
      - name: accountIdOrExternalId
        in: path
        required: true
        schema:
          type: string
        example: fee1ce9d-c40c-4ef6-8f8c-77461315713d
        description: The internal Connect AI account Id or the external Id of the sub-account.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfo'
              example:
                id: fee1ce9d-c40c-4ef6-8f8c-77461315713d
                externalId: ExternalId
                accountName: Acme Corporation
                created: '2023-07-13T20:42:56.317Z'
  /poweredby/account/create:
    post:
      summary: Create Account
      tags:
      - Account
      operationId: createAccount
      description: Create Account creates an account in the Connect AI Embed product. All request body fields are optional. If you send an empty body (`{}`), Create Account creates a sub-account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
            example:
              externalId: MyExternalId
              accountName: Acme Corporation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAccountResult'
              example:
                accountId: 8744e71e-ee33-4d4e-916f-0a21eba65902
                externalId: MyExternalId
                createdTime: '2024-07-10T19:10:52.139Z'
  /poweredby/account/update/{subAccountId}:
    put:
      summary: Update Sub-Account
      tags:
      - Account
      operationId: updateAccount
      description: Update Sub-Account updates a sub-account within the parent account. Include only the fields you want to change in the request body.
      parameters:
      - name: subAccountId
        in: path
        required: true
        schema:
          type: string
        example: fee1ce9d-c40c-4ef6-8f8c-77461315713d
        description: The internal Connect AI account Id of the sub-account to update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
            example:
              externalId: MyExternalId
              accountName: Acme Corporation
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountInfo'
              example:
                id: fee1ce9d-c40c-4ef6-8f8c-77461315713d
                externalId: MyExternalId
                accountName: Acme Corporation
                created: '2023-07-13T20:42:56.317Z'
  /poweredby/account/delete/{id}:
    delete:
      summary: Delete Sub-Account
      tags:
      - Account
      operationId: deleteAccount
      description: Delete Sub-Account deletes a sub-account from the Connect AI Embed product.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        example: fee1ce9d-c40c-4ef6-8f8c-77461315713d
        description: The sub-account Id.
      responses:
        '200':
          description: OK
components:
  schemas:
    AccountListResult:
      type: object
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountInfo'
          nullable: true
      additionalProperties: false
    CreateAccountResult:
      type: object
      required:
      - accountId
      - externalId
      - createdTime
      properties:
        accountId:
          type: string
          description: The internal Connect AI account Id.
        externalId:
          type: string
          description: The customer's identifier.
        createdTime:
          type: string
          format: date-time
          description: The time when the account was created.
      additionalProperties: false
    UpdateAccountRequest:
      type: object
      properties:
        externalId:
          type: string
          description: (Optional) The new external Id for the sub-account.
          nullable: true
        accountName:
          type: string
          description: (Optional) The new display name for the sub-account.
          nullable: true
      additionalProperties: false
    CreateAccountRequest:
      type: object
      properties:
        externalId:
          type: string
          description: (Optional) The external Id of the account to be created.
          nullable: true
        accountName:
          type: string
          description: (Optional) The display name of the account to be created.
          nullable: true
      additionalProperties: false
    AccountInfo:
      type: object
      required:
      - id
      - externalId
      - created
      properties:
        id:
          type: string
          description: The internal Connect AI account Id.
        externalId:
          type: string
          description: The Connect AI Embed external account identifier.
        accountName:
          type: string
          description: The display name of the account.
          nullable: true
        created:
          type: string
          format: date-time
          description: The time this account was created.
      additionalProperties: false
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token authentication. Include the token in the Authorization header as `Bearer {token}`. See [Authentication](/en/API/Authentication-Embedded) for more information on creating a token.
