          type: string
          description: A string containing the CData-hosted connection URL to redirect the user to.
      additionalProperties: false
    ConnectionListItem:
      type: object
      required:
        - id
        - name
        - dataSource
        - lastModified
        - mcpUrl
        - status
      properties:
        id:
          type: string
          format: uuid
          description: The connection Id.
        name:
          type: string
          description: The connection name.
        dataSource:
          type: string
          description: The data source type (for example, ExcelOnline, MailChimp).
        lastModified:
          type: string
          format: date-time
          description: The date and time the connection was last modified.
        externalId:
          type: string
          nullable: true
          description: |
            Optional externalId set when the connection was created via redirect. Your identifier for this connection in your own system. Unique within a sub-account (null values are excluded from the uniqueness constraint). Use this field to correlate Connect AI connections with records in your own database. Distinct from the `external_identity` JWT claim, which is a per-request user-level audit identifier.
        mcpUrl:
          type: string
          description: "The per-connection MCP endpoint URL, for example, /mcp/connections/{id}."
        status:
          type: string
          description: "Connection status. Possible values include Authenticated, NotAuthenticated, and Conditional."
      additionalProperties: false
