                    error:
                      code: "SERVICE_ACCOUNT_NOT_FOUND"
                      message: "The specified service account does not exist."
                workspace_not_found:
                  summary: Workspace not found
                  value:
                    error:
                      code: "WORKSPACE_NOT_FOUND"
                      message: "The specified workspace does not exist."
                role_assignment_not_found:
                  summary: Role not assigned in this workspace
                  value:
                    error:
                      code: "ROLE_ASSIGNMENT_NOT_FOUND"
                      message: "This role is not assigned to the service account in this workspace."
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                cannot_remove_last_workspace_admin:
                  summary: Last workspace admin guard
                  value:
                    error:
                      code: "CANNOT_REMOVE_LAST_WORKSPACE_ADMIN"
                      message: "Cannot remove the last workspace_admin from this workspace."

