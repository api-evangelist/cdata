  # ── Service Accounts (CAP-001-B) ───────────────────────────────────────────
  /service-accounts:
    post:
      summary: Create Service Account
      tags:
        - Service Accounts
      operationId: createServiceAccount
      description: >
        Create a service account for machine identity use (CI/CD pipelines, IaC tooling,
        Terraform automation). The `client_id` in the response is used for OAuth 2.0 client
        credentials authentication. This endpoint is idempotent by `external_id`: a second
        POST with the same `external_id` returns the existing record.
      security:
        - oauth2:
            - management:service-accounts:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServiceAccountRequest"
            example:
              name: "pipeline-deploy-prod"
              description: "Terraform deployment pipeline for production"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccount"
              example:
                id: "c3d4e5f6-a7b8-9012-cdef-123456789012"
                name: "pipeline-deploy-prod"
                description: "Terraform deployment pipeline for production"
                status: "active"
                client_id: "d4e5f6a7-b8c9-0123-defa-234567890123"
                external_id: null
                created_at: "2026-06-01T08:00:00Z"
                created_by: "00000000-0000-0000-0000-000000000001"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                already_exists:
                  summary: Name already in use
                  value:
                    error:
                      code: "SERVICE_ACCOUNT_ALREADY_EXISTS"
                      message: "A service account with this name already exists in the organization."

    get:
      summary: List Service Accounts
      tags:
        - Service Accounts
      operationId: listServiceAccounts
      description: >
        List all service accounts in the organization.
      security:
        - oauth2:
            - management:service-accounts:read
      parameters:
        - name: status
          in: query
          description: Filter by status.
          schema:
            type: string
            enum: [active, deactivated]
        - name: role_id
          in: query
          description: Filter to service accounts that hold a specific role (direct assignments only).
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum number of results to return per page.
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: cursor
          in: query
          description: Pagination cursor from `next_cursor` in the previous response.
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccountCollection"
              example:
                items:
                  - id: "c3d4e5f6-a7b8-9012-cdef-123456789012"
                    name: "pipeline-deploy-prod"
                    description: "Terraform deployment pipeline for production"
                    status: "active"
                    client_id: "d4e5f6a7-b8c9-0123-defa-234567890123"
                    external_id: null
                    created_at: "2026-06-01T08:00:00Z"
                    created_by: "00000000-0000-0000-0000-000000000001"
                limit: 20
                next_cursor: null

  /service-accounts/{id}:
    get:
      summary: Get Service Account
      tags:
        - Service Accounts
      operationId: getServiceAccount
      description: >
        Get a single service account, including its directly assigned permissions.
      security:
        - oauth2:
            - management:service-accounts:read
      parameters:
        - name: id
          in: path
          required: true
          description: Service account identifier (UUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccountDetail"
        "404":
          $ref: "#/components/responses/ServiceAccountNotFound"

    patch:
      summary: Update Service Account
      tags:
        - Service Accounts
      operationId: updateServiceAccount
      description: >
        Partially update a service account. Only fields included in the request body are
        modified; omitted fields retain their current values. Deactivating a service account
        immediately revokes all PATs.
      security:
        - oauth2:
            - management:service-accounts:write
      parameters:
        - name: id
          in: path
          required: true
          description: Service account identifier (UUID).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServiceAccountRequest"
            example:
              status: "deactivated"
      responses:
        "200":
          description: Returns the full service account object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccount"
        "404":
          $ref: "#/components/responses/ServiceAccountNotFound"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                name_conflict:
                  summary: Name already in use
                  value:
                    error:
                      code: "SERVICE_ACCOUNT_NAME_CONFLICT"
                      message: "A service account with this name already exists."

    delete:
      summary: Delete Service Account
      tags:
        - Service Accounts
      operationId: deleteServiceAccount
      description: >
        Deprovision a service account. Atomically revokes all PATs and removes all role
        assignments and direct permissions in a single transaction. This operation is
        irreversible.
      security:
        - oauth2:
            - management:service-accounts:write
      parameters:
        - name: id
          in: path
          required: true
          description: Service account identifier (UUID).
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: No Content
        "404":
          $ref: "#/components/responses/ServiceAccountNotFound"

  /service-accounts/{id}/roles:
    post:
      summary: Assign Service Account Role
      tags:
        - Service Accounts
      operationId: assignServiceAccountRole
      description: >
        Assign the account-wide admin system role to a service account. Only the `admin`
        role is assignable via this endpoint. All other system roles are workspace-scoped
        and must be assigned via
        `POST /service-accounts/{id}/workspaces/{workspace_id}/roles`. All service account
        role assignments are direct; service accounts are not members of SCIM-synced groups.
        This endpoint is idempotent: if the role is already assigned, the existing assignment
        is returned with HTTP 200.
      security:
        - oauth2:
            - management:service-accounts:write
      parameters:
        - name: id
          in: path
          required: true
          description: Service account identifier (UUID).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignRoleRequest"
            example:
              role_id: "00000000-0000-0000-0000-000000000010"
      responses:
        "201":
          description: Created. Returns the new assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccountRoleAssignment"
        "200":
          description: OK. The role is already assigned; returns the existing assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccountRoleAssignment"
              example:
                id: "r2b3c4d5-e6f7-8901-abcd-ef1234567890"
                service_account_id: "c3d4e5f6-a7b8-9012-cdef-123456789012"
                role_id: "00000000-0000-0000-0000-000000000010"
                role_name: "Admin"
                role_type: "system_role"
                grant_type: "direct"
                granted_at: "2026-06-02T09:00:00Z"
                granted_by: "00000000-0000-0000-0000-000000000001"
        "404":
          $ref: "#/components/responses/ServiceAccountNotFound"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                system_role_limit:
                  summary: Service account already holds the admin role
                  value:
                    error:
                      code: "SYSTEM_ROLE_LIMIT"
                      message: "The service account already holds the admin role."
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                role_not_found:
                  summary: Role does not exist
                  value:
                    error:
                      code: "ROLE_NOT_FOUND"
                      message: "The specified role does not exist."
                role_not_assignable:
                  summary: Role is not the admin role
                  value:
                    error:
                      code: "ROLE_NOT_ASSIGNABLE"
                      message: "Only the admin role is assignable via this endpoint. For workspace-scoped system roles, use POST /service-accounts/{id}/workspaces/{workspace_id}/roles."

    get:
      summary: List Service Account Roles
      tags:
        - Service Accounts
      operationId: listServiceAccountRoles
      description: >
        List all roles assigned to a service account with provenance.
      security:
        - oauth2:
            - management:service-accounts:read
      parameters:
        - name: id
          in: path
          required: true
          description: Service account identifier (UUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceAccountRoleCollection"
              example:
                items:
                  - role_id: "00000000-0000-0000-0000-000000000010"
                    role_name: "Admin"
                    role_type: "system_role"
                    grant_type: "direct"
                    group_id: null
                    group_name: null
                    granted_at: "2026-06-02T09:00:00Z"
                limit: 20
                next_cursor: null
        "404":
          $ref: "#/components/responses/ServiceAccountNotFound"

