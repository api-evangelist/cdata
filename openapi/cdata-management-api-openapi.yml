# ── Components ────────────────────────────────────────────────────────────────
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://cloud-login.cdata.com/oauth/token
          scopes:
            management:users:read: Read access to user resources.
            management:users:write: Write access to user resources.
            management:service-accounts:read: Read access to service account resources.
            management:service-accounts:write: Write access to service account resources.
#             management:roles:read: Read access to role resources.
#             management:roles:write: Write access to role resources.

  responses:
    UserNotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "USER_NOT_FOUND"
              message: "The specified user does not exist."
    ServiceAccountNotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "SERVICE_ACCOUNT_NOT_FOUND"
              message: "The specified service account does not exist."
    WorkspaceNotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "WORKSPACE_NOT_FOUND"
              message: "The specified workspace does not exist."
    RoleNotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "ROLE_NOT_FOUND"
              message: "The specified role does not exist."
    ValidationError:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: "VALIDATION_ERROR"
              message: "Missing required field or invalid value."

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          description: Error details.
          properties:
            code:
              type: string
              description: SCREAMING_SNAKE_CASE error code.
            message:
              type: string
              description: Human-readable error description.

    CollectionEnvelope:
      type: object
      properties:
        limit:
          type: integer
          description: Maximum number of items per page as requested.
        next_cursor:
          type: string
          nullable: true
          description: Pagination cursor for the next page. null when no further pages exist. Total count is not returned.

    Permission:
      type: object
      properties:
        resource:
          type: string
          description: >
            The name of the specific connection instance this permission applies to. This
            is the connection name as defined in Connect AI, not the connector type.
        operations:
          type: array
          items:
            type: string
            enum: [create, read, update, delete, execute]
          description: Allowed operations on the resource.
        type:
          type: string
          enum: [connection]
          description: Always `connection`. Classifies what category of resource the permission governs.

    AssignPermissionRequest:
      type: object
      required: [resource, operations, type]
      properties:
        resource:
          type: string
          description: >
            The name of the specific connection instance this permission applies to. This
            is the connection name as defined in Connect AI, not the connector type.
        operations:
          type: array
          items:
            type: string
            enum: [create, read, update, delete, execute]
          description: One or more operations to permit on the resource.
        type:
          type: string
          enum: [connection]
          description: Always `connection`. Classifies what category of resource the permission governs.

    AssignRoleRequest:
      type: object
      required: [role_id]
      properties:
        role_id:
          type: string
          format: uuid
          description: Role to assign. Must exist in the organization.

    # ── User schemas ────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: User identifier.
        email:
          type: string
          format: email
          description: The email address of the user.
        first_name:
          type: string
          description: The user's first name.
        last_name:
          type: string
          nullable: true
          description: The user's last name.
        status:
          type: string
          enum: [active, invited, deactivated]
          description: Current lifecycle state of the user.
        scim_managed:
          type: boolean
          description: "`false` for API-created users. `true` for SCIM-provisioned users."
        external_id:
          type: string
          nullable: true
          description: Idempotency key supplied by the calling system.
        created_at:
          type: string
          format: date-time
          description: ISO 8601 UTC.
        created_by:
          type: string
          format: uuid
          nullable: true
          description: User ID of the creator. null for SCIM-provisioned users.

    CreateUserRequest:
      type: object
      required: [email, first_name]
      properties:
        email:
          type: string
          format: email
          description: Must be globally unique across all Connect AI orgs.
        first_name:
          type: string
          description: The user's first name.
        last_name:
          type: string
          nullable: true
          description: The user's last name. Omit for users with a single name.
        external_id:
          type: string
          description: >
            Idempotency key supplied by the calling system (for example, an HR system
            employee ID or Terraform resource ID). A second POST with the same key returns
            the existing user instead of creating a duplicate. Connect AI does not generate
            this value; the caller provides it.

    BatchCreateUsersRequest:
      type: object
      required: [users]
      properties:
        users:
          type: array
          maxItems: 500
          description: >
            Up to 500 user records. Each record supports all fields from `POST /users`.
            If a record includes an `external_id` that matches an existing user, that user
            is updated rather than created.
          items:
            $ref: "#/components/schemas/CreateUserRequest"

    BatchCreateUsersResponse:
      type: object
      properties:
        created:
          type: array
          description: Users successfully created.
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: User identifier.
              email:
                type: string
                description: Email address of the created user.
              external_id:
                type: string
                nullable: true
                description: Idempotency key supplied by the caller. null if not provided.
        updated:
          type: array
          description: Records matched via `external_id` and updated.
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: User identifier.
              email:
                type: string
                description: Email address of the updated user.
              external_id:
                type: string
                nullable: true
                description: Idempotency key supplied by the caller.
        failed:
          type: array
          description: Records that could not be created or updated.
          items:
            type: object
            properties:
              email:
                type: string
                description: Email address from the failed record.
              external_id:
                type: string
                nullable: true
                description: Idempotency key from the failed record. null if not provided.
              error_code:
                type: string
                description: SCREAMING_SNAKE_CASE error code for the failure.
              message:
                type: string
                description: Human-readable description of the failure.
        summary:
          type: object
          description: Aggregate counts for the batch operation.
          properties:
            total:
              type: integer
              description: Total number of records submitted.
            created:
              type: integer
              description: Number of records successfully created.
            updated:
              type: integer
              description: Number of records successfully updated.
            failed:
              type: integer
              description: Number of records that failed.

    UserDetail:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            permissions:
              type: array
              items:
                $ref: "#/components/schemas/UserPermissionAssignment"
              description: Direct permissions assigned to this user.

    UserCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionEnvelope"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/User"

    UpdateUserRequest:
      type: object
      properties:
        first_name:
          type: string
          description: >
            The user's first name. Not accepted for `scim_managed: true` users; name fields are
            owned by the IdP.
        last_name:
          type: string
          nullable: true
          description: >
            The user's last name. null for users with a single name. Not accepted for
            `scim_managed: true` users.
        status:
          type: string
          enum: [active, deactivated]
          description: Lifecycle state. Deactivating immediately revokes all PATs.

    UserRoleAssignment:
      type: object
      description: A direct role assignment made via POST /users/{id}/roles.
      properties:
        id:
          type: string
          format: uuid
          description: Assignment identifier.
        user_id:
          type: string
          format: uuid
          description: The user this role is assigned to.
        role_id:
          type: string
          format: uuid
          description: The role identifier.
        role_name:
          type: string
          description: The name of the role.
        role_type:
          type: string
          enum: [system_role]
          description: Always `system_role` (admin) for assignments made via this endpoint.
        grant_type:
          type: string
          enum: [direct]
          description: Always `direct` for assignments made via this endpoint.
        granted_at:
          type: string
          format: date-time
          description: ISO 8601 UTC.
        granted_by:
          type: string
          format: uuid
          description: The user who granted the role.

    UserRoleItem:
      type: object
      description: >
        A role held by a user, with full provenance. Returned by
        GET /users/{id}/roles.
      properties:
        role_id:
          type: string
          format: uuid
          description: The role identifier.
        role_name:
          type: string
          description: The name of the role.
        role_type:
          type: string
          enum: [system_role, access_role]
          description: The type of the role.
        grant_type:
          type: string
          enum: [direct, group_derived, workspace_derived]
          description: >
            How this role was conferred. `direct`: assigned explicitly. `group_derived`:
            inherited via a group membership. `workspace_derived`: inherited via workspace
            configuration (placeholder term; exact name is subject to change).
        group_id:
          type: string
          format: uuid
          nullable: true
          description: "Set for `grant_type: group_derived`: the group that conferred this role. null for direct grants."
        group_name:
          type: string
          nullable: true
          description: Group display name. null for direct grants.
        granted_at:
          type: string
          format: date-time
          description: ISO 8601 UTC.

    UserRoleCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionEnvelope"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/UserRoleItem"

    UserPermissionAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Permission identifier.
        user_id:
          type: string
          format: uuid
          description: The user this permission is assigned to.
        resource:
          type: string
          description: The connection name this permission applies to.
        operations:
          type: array
          items:
            type: string
            enum: [create, read, update, delete, execute]
          description: Allowed operations on the resource.
        type:
          type: string
          enum: [connection]
          description: Always `connection`. Classifies what category of resource the permission governs.
        assigned_at:
          type: string
          format: date-time
          description: ISO 8601 UTC.
        assigned_by:
          type: string
          format: uuid
          description: The user who assigned this permission.

    UserPermissionCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionEnvelope"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/UserPermissionAssignment"

    UserWorkspaceRoleAssignment:
      type: object
      description: A workspace-scoped role assignment for a user.
      properties:
        id:
          type: string
          format: uuid
          description: Assignment identifier.
        user_id:
          type: string
          format: uuid
          description: The user this workspace role is assigned to.
        workspace_id:
          type: string
          format: uuid
          description: The workspace this role is assigned to.
        role_id:
          type: string
          format: uuid
          description: The role identifier.
        role_name:
          type: string
          description: The name of the role.
        role_type:
          type: string
          enum: [system_role, access_role]
          description: "`system_role`: built-in, non-modifiable. `access_role`: custom, fully manageable."
        granted_at:
          type: string
          format: date-time
          description: ISO 8601 UTC.
        granted_by:
          type: string
          format: uuid
          description: The user who granted the workspace role.

    UserWorkspaceRoleCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionEnvelope"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/UserWorkspaceRoleAssignment"

    # ── Service Account schemas ─────────────────────────────────────────────
    ServiceAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Service account identifier.
        name:
          type: string
          description: Unique display name within the organization.
        description:
          type: string
          nullable: true
          description: Optional free-text description of the service account.
        status:
          type: string
          enum: [active, deactivated]
          description: Current lifecycle state of the service account.
        client_id:
          type: string
          format: uuid
          description: Auto-generated. Used for OAuth 2.0 client credentials authentication.
        external_id:
          type: string
          nullable: true
          description: Idempotency key supplied by the calling system.
        created_at:
          type: string
          format: date-time
          description: ISO 8601 UTC.
        created_by:
          type: string
          format: uuid
          description: User ID of the creator.

    ServiceAccountDetail:
      allOf:
        - $ref: "#/components/schemas/ServiceAccount"
        - type: object
          properties:
            permissions:
              type: array
              items:
                $ref: "#/components/schemas/ServiceAccountPermissionAssignment"
              description: Direct permissions assigned to this service account.

    ServiceAccountCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionEnvelope"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ServiceAccount"

    CreateServiceAccountRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Unique display name within the organization.
        description:
          type: string
          description: Optional free-text description of the service account.
        external_id:
          type: string
          description: Idempotency key. A second POST with the same `external_id` returns the existing record.

    UpdateServiceAccountRequest:
      type: object
      properties:
        name:
          type: string
          description: New display name. Must be unique within the organization.
        description:
          type: string
          description: New description. Replaces the existing value.
        status:
          type: string
          enum: [active, deactivated]
          description: Deactivating immediately revokes all PATs.

    ServiceAccountRoleAssignment:
      type: object
      description: A direct role assignment made via POST /service-accounts/{id}/roles.
      properties:
        id:
          type: string
          format: uuid
          description: Assignment identifier.
        service_account_id:
          type: string
          format: uuid
          description: The service account this role is assigned to.
        role_id:
          type: string
          format: uuid
          description: The role identifier.
        role_name:
          type: string
          description: The name of the role.
        role_type:
          type: string
          enum: [system_role]
          description: Always `system_role` (admin) for assignments made via this endpoint.
        grant_type:
          type: string
          enum: [direct]
          description: Always `direct`.
        granted_at:
          type: string
          format: date-time
          description: ISO 8601 UTC.
        granted_by:
          type: string
          format: uuid
          description: The user who granted the role.

    ServiceAccountRoleItem:
      type: object
      description: A role held by a service account, with provenance.
      properties:
        role_id:
          type: string
          format: uuid
          description: The role identifier.
        role_name:
          type: string
          description: The name of the role.
        role_type:
          type: string
          description: The type of the role.
          enum: [system_role, access_role]
        grant_type:
          type: string
          enum: [direct, group_derived]
          description: >
            `direct` for all current assignments. `group_derived` will be added when
            custom group membership for service accounts ships (Non-MVP).
        group_id:
          type: string
          format: uuid
          nullable: true
          description: "Set for `grant_type: group_derived` (Non-MVP): the custom group that conferred this role. null for direct grants."
        group_name:
          type: string
          nullable: true
          description: Custom group display name. null for direct grants.
        granted_at:
          type: string
          format: date-time
          description: ISO 8601 UTC.

    ServiceAccountRoleCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionEnvelope"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ServiceAccountRoleItem"

    ServiceAccountPermissionAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Permission identifier.
        service_account_id:
          type: string
          format: uuid
          description: The service account this permission is assigned to.
        resource:
          type: string
          description: The connection name this permission applies to.
        operations:
          type: array
          items:
            type: string
            enum: [create, read, update, delete, execute]
          description: Allowed operations on the resource.
        type:
          type: string
          enum: [connection]
          description: Always `connection`. Classifies what category of resource the permission governs.
        assigned_at:
          type: string
          format: date-time
          description: ISO 8601 UTC.
        assigned_by:
          type: string
          format: uuid
          description: The user who assigned this permission.

    ServiceAccountPermissionCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionEnvelope"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ServiceAccountPermissionAssignment"

    ServiceAccountWorkspaceRoleAssignment:
      type: object
      description: A workspace-scoped role assignment for a service account.
      properties:
        id:
          type: string
          format: uuid
          description: Assignment identifier.
        service_account_id:
          type: string
          format: uuid
          description: The service account this workspace role is assigned to.
        workspace_id:
          type: string
          format: uuid
          description: The workspace this role is assigned to.
        role_id:
          type: string
          format: uuid
          description: The role identifier.
        role_name:
          type: string
          description: The name of the role.
        role_type:
          type: string
          enum: [system_role, access_role]
          description: The type of the role.
        granted_at:
          type: string
          format: date-time
          description: ISO 8601 UTC.
        granted_by:
          type: string
          format: uuid
          description: The user who granted the workspace role.

    ServiceAccountWorkspaceRoleCollection:
      allOf:
        - $ref: "#/components/schemas/CollectionEnvelope"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ServiceAccountWorkspaceRoleAssignment"

