openapi: 3.2.0
info:
  title: CData Connect AI Management Service Accounts API
  version: v1
  description: The Connect AI Management API provides programmatic control over enterprise platform administration.
servers:
- url: https://cloud.cdata.com/api/v1/admin
  description: Production base URL
security:
- oauth2: []
tags:
- name: Service Accounts
  description: Full lifecycle management for machine identities (CI/CD pipelines, IaC tooling, Terraform automation). Service accounts are not SCIM-owned and authenticate via OAuth 2.0 client credentials using the `client_id` returned on creation.
paths:
  /service-accounts:
    post:
      summary: Create Service Account
      tags:
      - Service Accounts
      operationId: createServiceAccount
      description: 'Create a service account for machine identity use (CI/CD pipelines, IaC tooling, Terraform automation). The `client_id` in the response is used for OAuth 2.0 client credentials authentication. This endpoint is idempotent by `external_id`: a second POST with the same `external_id` returns the existing record.'
      security:
      - oauth2:
        - management:service-accounts:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceAccountRequest'
            example:
              name: pipeline-deploy-prod
              description: Terraform deployment pipeline for production
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccount'
              example:
                id: c3d4e5f6-a7b8-9012-cdef-123456789012
                name: pipeline-deploy-prod
                description: Terraform deployment pipeline for production
                status: active
                client_id: d4e5f6a7-b8c9-0123-defa-234567890123
                external_id: null
                created_at: '2026-06-01T08:00:00Z'
                created_by: 00000000-0000-0000-0000-000000000001
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                already_exists:
                  summary: Name already in use
                  value:
                    error:
                      code: SERVICE_ACCOUNT_ALREADY_EXISTS
                      message: A service account with this name already exists in the organization.
    get:
      summary: List Service Accounts
      tags:
      - Service Accounts
      operationId: listServiceAccounts
      description: List all service accounts in the organization.
      security:
      - oauth2:
        - management:service-accounts:read
      parameters:
      - name: status
        in: query
        description: Filter by status.
        schema:
          type: string
          enum:
          - active
          - deactivated
      - name: role_id
        in: query
        description: Filter to service accounts that hold a specific role (direct assignments only).
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Maximum number of results to return per page.
        schema:
          type: integer
          default: 20
          maximum: 100
      - name: cursor
        in: query
        description: Pagination cursor from `next_cursor` in the previous response.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountCollection'
              example:
                items:
                - id: c3d4e5f6-a7b8-9012-cdef-123456789012
                  name: pipeline-deploy-prod
                  description: Terraform deployment pipeline for production
                  status: active
                  client_id: d4e5f6a7-b8c9-0123-defa-234567890123
                  external_id: null
                  created_at: '2026-06-01T08:00:00Z'
                  created_by: 00000000-0000-0000-0000-000000000001
                limit: 20
                next_cursor: null
  /service-accounts/{id}:
    get:
      summary: Get Service Account
      tags:
      - Service Accounts
      operationId: getServiceAccount
      description: Get a single service account, including its directly assigned permissions.
      security:
      - oauth2:
        - management:service-accounts:read
      parameters:
      - name: id
        in: path
        required: true
        description: Service account identifier (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountDetail'
        '404':
          $ref: '#/components/responses/ServiceAccountNotFound'
    patch:
      summary: Update Service Account
      tags:
      - Service Accounts
      operationId: updateServiceAccount
      description: Partially update a service account. Only fields included in the request body are modified; omitted fields retain their current values. Deactivating a service account immediately revokes all PATs.
      security:
      - oauth2:
        - management:service-accounts:write
      parameters:
      - name: id
        in: path
        required: true
        description: Service account identifier (UUID).
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceAccountRequest'
            example:
              status: deactivated
      responses:
        '200':
          description: Returns the full service account object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccount'
        '404':
          $ref: '#/components/responses/ServiceAccountNotFound'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                name_conflict:
                  summary: Name already in use
                  value:
                    error:
                      code: SERVICE_ACCOUNT_NAME_CONFLICT
                      message: A service account with this name already exists.
    delete:
      summary: Delete Service Account
      tags:
      - Service Accounts
      operationId: deleteServiceAccount
      description: Deprovision a service account. Atomically revokes all PATs and removes all role assignments and direct permissions in a single transaction. This operation is irreversible.
      security:
      - oauth2:
        - management:service-accounts:write
      parameters:
      - name: id
        in: path
        required: true
        description: Service account identifier (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '404':
          $ref: '#/components/responses/ServiceAccountNotFound'
  /service-accounts/{id}/roles:
    post:
      summary: Assign Service Account Role
      tags:
      - Service Accounts
      operationId: assignServiceAccountRole
      description: 'Assign the account-wide admin system role to a service account. Only the `admin` role is assignable via this endpoint. All other system roles are workspace-scoped and must be assigned via `POST /service-accounts/{id}/workspaces/{workspace_id}/roles`. All service account role assignments are direct; service accounts are not members of SCIM-synced groups. This endpoint is idempotent: if the role is already assigned, the existing assignment is returned with HTTP 200.'
      security:
      - oauth2:
        - management:service-accounts:write
      parameters:
      - name: id
        in: path
        required: true
        description: Service account identifier (UUID).
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
            example:
              role_id: 00000000-0000-0000-0000-000000000010
      responses:
        '201':
          description: Created. Returns the new assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountRoleAssignment'
        '200':
          description: OK. The role is already assigned; returns the existing assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountRoleAssignment'
              example:
                id: r2b3c4d5-e6f7-8901-abcd-ef1234567890
                service_account_id: c3d4e5f6-a7b8-9012-cdef-123456789012
                role_id: 00000000-0000-0000-0000-000000000010
                role_name: Admin
                role_type: system_role
                grant_type: direct
                granted_at: '2026-06-02T09:00:00Z'
                granted_by: 00000000-0000-0000-0000-000000000001
        '404':
          $ref: '#/components/responses/ServiceAccountNotFound'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                system_role_limit:
                  summary: Service account already holds the admin role
                  value:
                    error:
                      code: SYSTEM_ROLE_LIMIT
                      message: The service account already holds the admin role.
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                role_not_found:
                  summary: Role does not exist
                  value:
                    error:
                      code: ROLE_NOT_FOUND
                      message: The specified role does not exist.
                role_not_assignable:
                  summary: Role is not the admin role
                  value:
                    error:
                      code: ROLE_NOT_ASSIGNABLE
                      message: Only the admin role is assignable via this endpoint. For workspace-scoped system roles, use POST /service-accounts/{id}/workspaces/{workspace_id}/roles.
    get:
      summary: List Service Account Roles
      tags:
      - Service Accounts
      operationId: listServiceAccountRoles
      description: List all roles assigned to a service account with provenance.
      security:
      - oauth2:
        - management:service-accounts:read
      parameters:
      - name: id
        in: path
        required: true
        description: Service account identifier (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountRoleCollection'
              example:
                items:
                - role_id: 00000000-0000-0000-0000-000000000010
                  role_name: Admin
                  role_type: system_role
                  grant_type: direct
                  group_id: null
                  group_name: null
                  granted_at: '2026-06-02T09:00:00Z'
                limit: 20
                next_cursor: null
        '404':
          $ref: '#/components/responses/ServiceAccountNotFound'
  /service-accounts/{id}/roles/{role_id}:
    delete:
      summary: Remove Service Account Role
      tags:
      - Service Accounts
      operationId: removeServiceAccountRole
      description: Remove a role assignment from a service account. Cannot remove group-derived roles via this endpoint.
      security:
      - oauth2:
        - management:service-accounts:write
      parameters:
      - name: id
        in: path
        required: true
        description: Service account identifier (UUID).
        schema:
          type: string
          format: uuid
      - name: role_id
        in: path
        required: true
        description: Role identifier (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Service account not found
                  value:
                    error:
                      code: SERVICE_ACCOUNT_NOT_FOUND
                      message: The specified service account does not exist.
                assignment_not_found:
                  summary: Role not assigned
                  value:
                    error:
                      code: ROLE_ASSIGNMENT_NOT_FOUND
                      message: This role is not assigned to the service account.
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cannot_remove_group_derived_role:
                  summary: Role is group-derived
                  value:
                    error:
                      code: CANNOT_REMOVE_GROUP_DERIVED_ROLE
                      message: Role was conferred via a custom group. Use DELETE /groups/{id}/roles/{role_id}.
  /service-accounts/{id}/permissions:
    post:
      summary: Assign Service Account Permission
      tags:
      - Service Accounts
      operationId: assignServiceAccountPermission
      description: Assign a direct resource permission to a service account.
      security:
      - oauth2:
        - management:service-accounts:write
      parameters:
      - name: id
        in: path
        required: true
        description: Service account identifier (UUID).
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignPermissionRequest'
            example:
              resource: snowflake-prod
              operations:
              - read
              - execute
              type: connection
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountPermissionAssignment'
              example:
                id: p2b3c4d5-e6f7-8901-abcd-ef1234567890
                service_account_id: c3d4e5f6-a7b8-9012-cdef-123456789012
                resource: snowflake-prod
                operations:
                - read
                - execute
                type: connection
                assigned_at: '2026-06-15T11:00:00Z'
                assigned_by: 00000000-0000-0000-0000-000000000001
        '404':
          $ref: '#/components/responses/ServiceAccountNotFound'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_operation:
                  summary: Invalid operation value
                  value:
                    error:
                      code: INVALID_OPERATION
                      message: One or more operation values are not valid.
                invalid_permission_type:
                  summary: Invalid type value
                  value:
                    error:
                      code: INVALID_PERMISSION_TYPE
                      message: Permission type must be connection.
    get:
      summary: List Service Account Permissions
      tags:
      - Service Accounts
      operationId: listServiceAccountPermissions
      description: List all direct resource permissions assigned to a service account.
      security:
      - oauth2:
        - management:service-accounts:read
      parameters:
      - name: id
        in: path
        required: true
        description: Service account identifier (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountPermissionCollection'
              example:
                items:
                - id: p2b3c4d5-e6f7-8901-abcd-ef1234567890
                  service_account_id: c3d4e5f6-a7b8-9012-cdef-123456789012
                  resource: snowflake-prod
                  operations:
                  - read
                  - execute
                  type: connection
                  assigned_at: '2026-06-15T11:00:00Z'
                  assigned_by: 00000000-0000-0000-0000-000000000001
                limit: 20
                next_cursor: null
        '404':
          $ref: '#/components/responses/ServiceAccountNotFound'
  /service-accounts/{id}/permissions/{permission_id}:
    delete:
      summary: Remove Service Account Permission
      tags:
      - Service Accounts
      operationId: removeServiceAccountPermission
      description: Remove a direct permission from a service account. The service account entity is not deleted.
      security:
      - oauth2:
        - management:service-accounts:write
      parameters:
      - name: id
        in: path
        required: true
        description: Service account identifier (UUID).
        schema:
          type: string
          format: uuid
      - name: permission_id
        in: path
        required: true
        description: Permission identifier (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Service account not found
                  value:
                    error:
                      code: SERVICE_ACCOUNT_NOT_FOUND
                      message: The specified service account does not exist.
                permission_not_found:
                  summary: Permission not assigned
                  value:
                    error:
                      code: PERMISSION_NOT_FOUND
                      message: The specified permission is not assigned to this service account.
  /service-accounts/{id}/workspaces/{workspace_id}/roles:
    post:
      summary: Assign Service Account Workspace Role
      tags:
      - Service Accounts
      operationId: assignServiceAccountWorkspaceRole
      description: Assign a workspace-scoped role (system or custom access) to a service account. This is how `workspace_admin` and other workspace-scoped system roles are granted; only the account-wide `admin` role is assigned via `POST /service-accounts/{id}/roles`. The service account must be a direct member of the target workspace before this call.
      security:
      - oauth2:
        - management:service-accounts:write
      parameters:
      - name: id
        in: path
        required: true
        description: Service account identifier (UUID).
        schema:
          type: string
          format: uuid
      - name: workspace_id
        in: path
        required: true
        description: Workspace identifier (UUID).
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignRoleRequest'
            example:
              role_id: 00000000-0000-0000-0000-000000000020
      responses:
        '201':
          description: Created. Returns the new workspace role assignment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountWorkspaceRoleAssignment'
              example:
                id: r3b4c5d6-e7f8-9012-abcd-ef1234567890
                service_account_id: c3d4e5f6-a7b8-9012-cdef-123456789012
                workspace_id: w1b2c3d4-e5f6-7890-abcd-ef1234567890
                role_id: 00000000-0000-0000-0000-000000000020
                role_name: workspace_admin
                role_type: system_role
                granted_at: '2026-06-01T12:00:00Z'
                granted_by: 00000000-0000-0000-0000-000000000001
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Service account not found
                  value:
                    error:
                      code: SERVICE_ACCOUNT_NOT_FOUND
                      message: The specified service account does not exist.
                workspace_not_found:
                  summary: Workspace not found
                  value:
                    error:
                      code: WORKSPACE_NOT_FOUND
                      message: The specified workspace does not exist.
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                system_role_limit:
                  summary: Service account already holds a workspace system role
                  value:
                    error:
                      code: SYSTEM_ROLE_LIMIT
                      message: The service account already holds a workspace-scoped system role in this workspace. One per workspace.
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                role_not_found:
                  summary: Role does not exist
                  value:
                    error:
                      code: ROLE_NOT_FOUND
                      message: The specified role does not exist.
                entity_not_in_workspace:
                  summary: Service account not a workspace member
                  value:
                    error:
                      code: ENTITY_NOT_IN_WORKSPACE
                      message: The service account must be a direct member of the target workspace before a workspace-scoped role can be assigned.
    get:
      summary: List Service Account Workspace Roles
      tags:
      - Service Accounts
      operationId: listServiceAccountWorkspaceRoles
      description: List all workspace-scoped role grants for a service account in a specific workspace.
      security:
      - oauth2:
        - management:service-accounts:read
      parameters:
      - name: id
        in: path
        required: true
        description: Service account identifier (UUID).
        schema:
          type: string
          format: uuid
      - name: workspace_id
        in: path
        required: true
        description: Workspace identifier (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccountWorkspaceRoleCollection'
              example:
                items:
                - id: r3b4c5d6-e7f8-9012-abcd-ef1234567890
                  service_account_id: c3d4e5f6-a7b8-9012-cdef-123456789012
                  workspace_id: w1b2c3d4-e5f6-7890-abcd-ef1234567890
                  role_id: 00000000-0000-0000-0000-000000000020
                  role_name: workspace_admin
                  role_type: system_role
                  granted_at: '2026-06-01T12:00:00Z'
                  granted_by: 00000000-0000-0000-0000-000000000001
                limit: 20
                next_cursor: null
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Service account not found
                  value:
                    error:
                      code: SERVICE_ACCOUNT_NOT_FOUND
                      message: The specified service account does not exist.
                workspace_not_found:
                  summary: Workspace not found
                  value:
                    error:
                      code: WORKSPACE_NOT_FOUND
                      message: The specified workspace does not exist.
  /service-accounts/{id}/workspaces/{workspace_id}/roles/{role_id}:
    delete:
      summary: Remove Service Account Workspace Role
      tags:
      - Service Accounts
      operationId: removeServiceAccountWorkspaceRole
      description: Remove a workspace-scoped role (system or access) from a service account.
      security:
      - oauth2:
        - management:service-accounts:write
      parameters:
      - name: id
        in: path
        required: true
        description: Service account identifier (UUID).
        schema:
          type: string
          format: uuid
      - name: workspace_id
        in: path
        required: true
        description: Workspace identifier (UUID).
        schema:
          type: string
          format: uuid
      - name: role_id
        in: path
        required: true
        description: Role identifier (UUID).
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_found:
                  summary: Service account not found
                  value:
                    error:
                      code: SERVICE_ACCOUNT_NOT_FOUND
                      message: The specified service account does not exist.
                workspace_not_found:
                  summary: Workspace not found
                  value:
                    error:
                      code: WORKSPACE_NOT_FOUND
                      message: The specified workspace does not exist.
                role_assignment_not_found:
                  summary: Role not assigned in this workspace
                  value:
                    error:
                      code: ROLE_ASSIGNMENT_NOT_FOUND
                      message: This role is not assigned to the service account in this workspace.
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cannot_remove_last_workspace_admin:
                  summary: Last workspace admin guard
                  value:
                    error:
                      code: CANNOT_REMOVE_LAST_WORKSPACE_ADMIN
                      message: Cannot remove the last workspace_admin from this workspace.
components:
  schemas:
    ServiceAccountWorkspaceRoleCollection:
      allOf:
      - $ref: '#/components/schemas/CollectionEnvelope'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ServiceAccountWorkspaceRoleAssignment'
    ServiceAccountPermissionCollection:
      allOf:
      - $ref: '#/components/schemas/CollectionEnvelope'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ServiceAccountPermissionAssignment'
    ServiceAccountRoleAssignment:
      type: object
      description: A direct role assignment made via POST /service-accounts/{id}/roles.
      properties:
        id:
          type: string
          format: uuid
          description: Assignment identifier.
        service_account_id:
          type: string
          format: uuid
          description: The service account this role is assigned to.
        role_id:
          type: string
          format: uuid
          description: The role identifier.
        role_name:
          type: string
          description: The name of the role.
        role_type:
          type: string
          enum:
          - system_role
          description: Always `system_role` (admin) for assignments made via this endpoint.
        grant_type:
          type: string
          enum:
          - direct
          description: Always `direct`.
        granted_at:
          type: string
          format: date-time
          description: ISO 8601 UTC.
        granted_by:
          type: string
          format: uuid
          description: The user who granted the role.
    ServiceAccountRoleCollection:
      allOf:
      - $ref: '#/components/schemas/CollectionEnvelope'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ServiceAccountRoleItem'
    AssignPermissionRequest:
      type: object
      required:
      - resource
      - operations
      - type
      properties:
        resource:
          type: string
          description: 'The name of the specific connection instance this permission applies to. This is the connection name as defined in Connect AI, not the connector type.

            '
        operations:
          type: array
          items:
            type: string
            enum:
            - create
            - read
            - update
            - delete
            - execute
          description: One or more operations to permit on the resource.
        type:
          type: string
          enum:
          - connection
          description: Always `connection`. Classifies what category of resource the permission governs.
    ServiceAccountRoleItem:
      type: object
      description: A role held by a service account, with provenance.
      properties:
        role_id:
          type: string
          format: uuid
          description: The role identifier.
        role_name:
          type: string
          description: The name of the role.
        role_type:
          type: string
          description: The type of the role.
          enum:
          - system_role
          - access_role
        grant_type:
          type: string
          enum:
          - direct
          - group_derived
          description: '`direct` for all current assignments. `group_derived` will be added when custom group membership for service accounts ships (Non-MVP).

            '
        group_id:
          type: string
          format: uuid
          nullable: true
          description: 'Set for `grant_type: group_derived` (Non-MVP): the custom group that conferred this role. null for direct grants.'
        group_name:
          type: string
          nullable: true
          description: Custom group display name. null for direct grants.
        granted_at:
          type: string
          format: date-time
          description: ISO 8601 UTC.
    ServiceAccountWorkspaceRoleAssignment:
      type: object
      description: A workspace-scoped role assignment for a service account.
      properties:
        id:
          type: string
          format: uuid
          description: Assignment identifier.
        service_account_id:
          type: string
          format: uuid
          description: The service account this workspace role is assigned to.
        workspace_id:
          type: string
          format: uuid
          description: The workspace this role is assigned to.
        role_id:
          type: string
          format: uuid
          description: The role identifier.
        role_name:
          type: string
          description: The name of the role.
        role_type:
          type: string
          enum:
          - system_role
          - access_role
          description: The type of the role.
        granted_at:
          type: string
          format: date-time
          description: ISO 8601 UTC.
        granted_by:
          type: string
          format: uuid
          description: The user who granted the workspace role.
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          description: Error details.
          properties:
            code:
              type: string
              description: SCREAMING_SNAKE_CASE error code.
            message:
              type: string
              description: Human-readable error description.
    ServiceAccountCollection:
      allOf:
      - $ref: '#/components/schemas/CollectionEnvelope'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ServiceAccount'
    AssignRoleRequest:
      type: object
      required:
      - role_id
      properties:
        role_id:
          type: string
          format: uuid
          description: Role to assign. Must exist in the organization.
    CollectionEnvelope:
      type: object
      properties:
        limit:
          type: integer
          description: Maximum number of items per page as requested.
        next_cursor:
          type: string
          nullable: true
          description: Pagination cursor for the next page. null when no further pages exist. Total count is not returned.
    CreateServiceAccountRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: Unique display name within the organization.
        description:
          type: string
          description: Optional free-text description of the service account.
        external_id:
          type: string
          description: Idempotency key. A second POST with the same `external_id` returns the existing record.
    ServiceAccountDetail:
      allOf:
      - $ref: '#/components/schemas/ServiceAccount'
      - type: object
        properties:
          permissions:
            type: array
            items:
              $ref: '#/components/schemas/ServiceAccountPermissionAssignment'
            description: Direct permissions assigned to this service account.
    ServiceAccount:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Service account identifier.
        name:
          type: string
          description: Unique display name within the organization.
        description:
          type: string
          nullable: true
          description: Optional free-text description of the service account.
        status:
          type: string
          enum:
          - active
          - deactivated
          description: Current lifecycle state of the service account.
        client_id:
          type: string
          format: uuid
          description: Auto-generated. Used for OAuth 2.0 client credentials authentication.
        external_id:
          type: string
          nullable: true
          description: Idempotency key supplied by the calling system.
        created_at:
          type: string
          format: date-time
          description: ISO 8601 UTC.
        created_by:
          type: string
          format: uuid
          description: User ID of the creator.
    ServiceAccountPermissionAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Permission identifier.
        service_account_id:
          type: string
          format: uuid
          description: The service account this permission is assigned to.
        resource:
          type: string
          description: The connection name this permission applies to.
        operations:
          type: array
          items:
            type: string
            enum:
            - create
            - read
            - update
            - delete
            - execute
          description: Allowed operations on the resource.
        type:
          type: string
          enum:
          - connection
          description: Always `connection`. Classifies what category of resource the permission governs.
        assigned_at:
          type: string
          format: date-time
          description: ISO 8601 UTC.
        assigned_by:
          type: string
          format: uuid
          description: The user who assigned this permission.
    UpdateServiceAccountRequest:
      type: object
      properties:
        name:
          type: string
          description: New display name. Must be unique within the organization.
        description:
          type: string
          description: New description. Replaces the existing value.
        status:
          type: string
          enum:
          - active
          - deactivated
          description: Deactivating immediately revokes all PATs.
  responses:
    ValidationError:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Missing required field or invalid value.
    ServiceAccountNotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: SERVICE_ACCOUNT_NOT_FOUND
              message: The specified service account does not exist.
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://cloud-login.cdata.com/oauth/token
          scopes:
            management:users:read: Read access to user resources.
            management:users:write: Write access to user resources.
            management:service-accounts:read: Read access to service account resources.
            management:service-accounts:write: Write access to service account resources.
