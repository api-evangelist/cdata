openapi: 3.2.0
info:
  title: CData Connect AI REST API Embedded Connection API
  version: v1
servers:
- url: https://cloud.cdata.com/api
  description: Production base URL
security:
- BearerAuth: []
tags:
- name: Connection
paths:
  /poweredby/connection/create:
    post:
      summary: Create Connection
      tags:
      - Connection
      operationId: createConnection
      description: Create Connection requests the Connection Create Flow from the Connect AI Embed product. Create Connection validates the JWT and returns a string containing the URL to redirect the user to. If you include the parameter `dataSource`, the URL redirects the user to an **Add Connection** page for the data source. If you omit `dataSource`, the URL redirects the user to a general **Add Connection** page where the user can select a connection to add from the connections list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectionRequest'
            example:
              dataSource: ExcelOnline
              redirectURL: https://www.google.com
              name: ExcelConnection
              externalId: acme-excel-001
      responses:
        '200':
          description: A string containing the CData-hosted connection URL to redirect the user to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectURLResponse'
              example:
                redirectURL: https://cloud.cdata.com/oem/user/connections/edit?token=eyJhbGciOiJSUzI1NiIs...truncated...&driver=ExcelOnline&redirectUrl=https%3A%2F%2Fwww.google.com
  /poweredby/connection/list:
    get:
      summary: List Connections
      tags:
      - Connection
      operationId: listConnections
      description: List Connections returns a list of connections for the sub-account. Use this endpoint for sub-account discovery scenarios. For example, you can reconcile connection mappings after a redirect failure, or look up the per-connection MCP URL for a known external identifier.
      parameters:
      - name: driver
        in: query
        required: false
        description: Filter to connections whose data source matches this value (case-insensitive).
        schema:
          type: string
          example: ExcelOnline
      - name: externalId
        in: query
        required: false
        description: Filter to connections with this externalId (case-sensitive).
        schema:
          type: string
          example: acme-excel-001
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionListResult'
              example:
                connections:
                - id: 880dc1a2-03c3-4288-9857-6f5c029d897c
                  name: ExcelOnline1
                  dataSource: ExcelOnline
                  lastModified: '2024-08-02T21:30:55.154Z'
                  externalId: acme-excel-001
                  mcpUrl: /mcp/connections/880dc1a2-03c3-4288-9857-6f5c029d897c
                  status: Authenticated
                - id: eeef6211-5d6f-4347-b5bb-f99d574e75e5
                  name: MailChimp1
                  dataSource: MailChimp
                  lastModified: '2023-10-11T20:43:33.28Z'
                  externalId: null
                  mcpUrl: /mcp/connections/eeef6211-5d6f-4347-b5bb-f99d574e75e5
                  status: Conditional
