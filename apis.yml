    url: scopes/cdata-scopes.yml
  - type: ErrorCatalog
    url: errors/cdata-problem-types.yml
  - type: DataModel
    url: data-model/cdata-data-model.yml
  - type: Documentation
    url: https://docs.cloud.cdata.com/en/API/Management-API
- aid: cdata:mcp-embedded
  name: CData Connect AI Embed MCP Server
  description: >-
    The Connect AI Embed MCP surface, for software vendors embedding CData connectivity in their own products. Adds a connection-scoped endpoint that pins an MCP session to a single data source connection, so an ISV can hand each of its customers a tenant-scoped agent surface. Authenticates with a JWT bearer token minted by the embedding vendor.
  humanURL: https://docs.cloud.cdata.com/en/API/MCP-Embedded
  baseURL: https://mcp.cloud.cdata.com
  tags:
  - Agents
  - Embedded
  - MCP
  - Multi-Tenant
  properties:
