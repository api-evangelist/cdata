apis:
- aid: cdata:mcp
  name: CData Connect AI MCP Server
  description: >-
    A hosted, remote Model Context Protocol server that exposes every data source connected to a CData
    Connect AI account as MCP tools — catalog, schema, table, column and stored procedure discovery plus
    SQL query and procedure execution. A companion Management MCP server at /mcp/mgmt lists available
    sources and creates, tests and manages connections. Both speak the MCP Streamable HTTP transport and
    authenticate with OAuth 2.1 (PKCE) or HTTP Basic with a Personal Access Token.
  humanURL: https://docs.cloud.cdata.com/en/API/MCP
  baseURL: https://mcp.cloud.cdata.com
  tags:
  - Artificial Intelligence
  - Agents
  - Data Access
  - MCP
