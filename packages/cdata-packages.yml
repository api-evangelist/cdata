specification: API Commons Packages
specificationVersion: '0.1'
provider: CData
providerId: cdata
generated: '2026-09-05'
method: searched
source: >-
  registry.npmjs.org, pypi.org/pypi/<pkg>/json, api.nuget.org registration index,
  search.maven.org, plus https://www.cdata.com/developers/ and
  https://www.cdata.com/solutions/cli/. Versions and dates read from registry metadata
  endpoints on 2026-09-05.
note: >-
  CData publishes two distinct families and they should not be conflated. The first is a
  small set of first-party clients for CData's OWN Connect AI API (the Python DB-API
  connector, the n8n node, the agent scaffolder) — these are the SDKs that matter for
  consuming the APIs in this record. The second is the CData connector catalogue: several
  hundred ADO.NET providers on NuGet, published under the author "CData Software, Inc.",
  which are CData's PRODUCT (drivers that talk to third-party systems), not clients of
  CData's API. Both are genuinely first-party; only the first family is an SDK for this
  provider's own contract, and the entries are marked with `role` so the distinction
  survives.
packages:
- name: cdata-connect-ai
  registry: pypi
  url: https://pypi.org/project/cdata-connect-ai/
  official: true
  role: sdk
  language: python
  version: 1.2.0
  published: '2026-05-07'
  license: MIT
  description: >-
    PEP 249-compliant Python connector for CData Connect AI — live SQL access to 350+
    enterprise data sources.
  publisher: '"CData Software, Inc." <support@cdata.com>'
  homepage: https://www.cdata.com/ai/analytics/
  releases: 3
  note: >-
    The Connect AI Python SDK named on
    https://www.cdata.com/developers/ai/python-sdk/ (`pip install cdata-connect-ai`).
    Current relative to the API — released four months before this probe, and the API's
    own release notes were still shipping weekly at the time of the probe.
- name: cdata-connect
  registry: pypi
  url: https://pypi.org/project/cdata-connect/
  official: true
  role: sdk
  language: python
  version: 0.0.2
  published: '2026-03-23'
  license: null
  description: CData Connect Python DB-API 2.0 interface library.
  publisher: '"CData Software, Inc." <support@cdata.com>'
  homepage: https://www.cdata.com/ai/analytics/
  note: >-
    Predecessor to cdata-connect-ai, same publisher and same homepage, last released
    2026-03-23 at 0.0.2. Superseded rather than abandoned — treat cdata-connect-ai as the
    live package.
- name: '@cdatasoftware/create-agent'
  registry: npm
  url: https://www.npmjs.com/package/@cdatasoftware/create-agent
  official: true
  role: scaffold
  language: javascript
  version: 0.1.0
  published: '2026-06-02'
  license: MIT
  description: Scaffold a CData agent template (ADK, AI SDK, LangChain) into the current directory.
  repository: https://github.com/CDataSoftware/connect-ai-sample-agents
  note: >-
    Named on the Developer Edition page as the sample agent scaffold
    (`npx @cdatasoftware/create-agent`).
- name: '@cdatasoftware/n8n-nodes-cdata-connect-ai'
  registry: npm
  url: https://www.npmjs.com/package/@cdatasoftware/n8n-nodes-cdata-connect-ai
  official: true
  role: integration
  language: javascript
  version: 1.0.0
  published: '2026-04-06'
  license: MIT
  description: n8n community node for CData Connect AI.
  repository: https://github.com/CDataSoftware/connect-ai-n8n-node
  note: Single published version; the n8n integration is also documented at docs.cloud.cdata.com.
- name: cdatacli
  registry: cdn
  url: https://downloads.cdata.com/cdatabuilds/builds/free/cdatacli/
  official: true
  role: cli
  language: java
  version: null
  published: null
  note: >-
    The CData CLI is distributed from CData's own download host through install scripts
    (install-cdatacli-macos.sh, install-cdatacli-windows.ps1, install-cdatacli-linux.sh) that
    resolve to "the latest CLI". The URLs carry no version pin and CData publishes no
    registry metadata endpoint for it, so there is nothing to read a version or a release
    date from — checked, nothing to record. A consumer installing it cannot tell what
    version they are getting either; that is the finding, not a gap in this probe.
    See cli/cdata-cli.yml.
- name: CData ADO.NET Providers (NuGet)
  registry: nuget
  url: https://www.nuget.org/profiles/CData
  official: true
  role: driver
  language: dotnet
  family: true
  version: 26.0.9666
  published: '2026-06-19'
  note: >-
    A large family of individually-published packages named CData.<Source>
    (CData.Salesforce, CData.Snowflake, CData.OData, CData.Databricks, CData.Excel, …),
    all authored by "CData Software, Inc.". A NuGet search for "CData" returns 986 hits, of
    which the great majority are these providers; the exact first-party count was not
    enumerated because NuGet's `owner:` filter returns zero for this publisher and the
    search index does not expose the owner list. The version/published fields above are the
    newest exemplar observed, CData.Salesforce 26.0.9666 (2026-06-19). These are drivers
    that connect .NET applications to third-party systems — CData's product — not clients of
    CData's own API, and they should not be counted toward SDK coverage for the APIs in this
    record.
  exemplars:
  - name: CData.Salesforce
    version: 26.0.9666
    published: '2026-06-19'
    url: https://www.nuget.org/packages/CData.Salesforce/
  - name: CData.OData
    version: 26.0.9655
    published: '2026-06-08'
    url: https://www.nuget.org/packages/CData.OData/
registries_checked:
- registry: npm
  result: 'two first-party packages under the @cdatasoftware scope (found via text search; the scope: filter returns 0)'
- registry: pypi
  result: two first-party packages (cdata-connect-ai, cdata-connect)
- registry: nuget
  result: several hundred first-party CData.* ADO.NET provider packages
- registry: maven-central
  result: >-
    no first-party artifacts. A search for "cdata" returns one unrelated package
    (com.neuronrobotics:cdata-java). CData's JDBC drivers are distributed from
    cdata.com under a commercial licence rather than published to Maven Central.
- registry: rubygems
  result: not checked — CData publishes no Ruby interface.
- registry: crates.io
  result: not checked — CData publishes no Rust interface.
- registry: pkg.go.dev
  result: >-
    not found. The website names Go among supported embedded-connector languages, but no
    first-party Go module was located.
- registry: packagist
  result: not checked — CData publishes no PHP interface.
maintainers:
- FN: Kin Lane
  email: info@apievangelist.com
